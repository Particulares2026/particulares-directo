name: Aplicación CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aplicacion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Usar Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar exactamente las versiones fijadas
        run: npm ci --ignore-scripts

      - name: Ejecutar las pruebas
        run: npm test

      - name: Comprobar TypeScript
        run: npm run lint

      - name: Bloquear vulnerabilidades altas o críticas de producción
        run: npm audit --omit=dev --audit-level=high
