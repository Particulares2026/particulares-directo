name: Verificación gratuita de la base de datos

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Esquema y permisos en una base temporal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Arrancar una base local vacía
        shell: bash
        run: |
          mv supabase/migrations supabase/migrations.saved
          mkdir supabase/migrations
          supabase db start
          rmdir supabase/migrations
          mv supabase/migrations.saved supabase/migrations

      - name: Aplicar el esquema actual
        shell: bash
        run: |
          docker exec -i supabase_db_particulares_directo_ci \
            psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            < supabase/schema.sql

      - name: Validar la normalización de destacados heredados
        shell: bash
        run: |
          docker exec -i supabase_db_particulares_directo_ci \
            psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            < supabase/migrations/0037_normalizar_destacados_heredados.sql

      - name: Revisar funciones SQL
        run: supabase db lint --local --level warning --fail-on error

      - name: Probar permisos y datos privados
        run: supabase test db --local
