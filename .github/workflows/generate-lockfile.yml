name: Generar archivo de dependencias

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generar-y-verificar:
    if: github.head_ref == 'chore/lockfile-ci-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código de la rama
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Usar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Generar el archivo de versiones exactas si falta
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Fija las versiones exactas de las dependencias"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Instalar exactamente las versiones fijadas
        run: npm ci --ignore-scripts

      - name: Ejecutar las pruebas
        run: npm test

      - name: Comprobar vulnerabilidades críticas de producción
        run: npm audit --omit=dev --audit-level=critical
